name: Versionar, Construir en GHCR y Crear Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento SemVer (auto detecta por Conventional Commits)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  versionar:
    name: Calcular y etiquetar nueva versión SemVer
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.bump.outputs.changelog }}

    steps:
      - name: Clonar repositorio completo con tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Calcular siguiente versión y actualizar package.json
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          BUMP_MODE="${{ inputs.bump || 'auto' }}"

          NEXT_VER=$(bun run scripts/version.ts "$BUMP_MODE" --dry-run)
          TAG_NAME="v${NEXT_VER}"

          # Si el tag ya existe en remoto, incrementar patch hasta encontrar uno libre
          while git rev-parse "$TAG_NAME" >/dev/null 2>&1; do
            IFS='.' read -r MAJ MIN PAT <<< "$NEXT_VER"
            NEXT_VER="${MAJ}.${MIN}.$((PAT + 1))"
            TAG_NAME="v${NEXT_VER}"
          done

          # Actualizar package.json sin crear tag local aún
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NEXT_VER}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Generar resumen de cambios desde el último tag
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" --no-merges)
          else
            CHANGELOG=$(git log -n 15 --pretty=format:"- %s (\`%h\`)" --no-merges)
          fi

          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG_NAME} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          echo "version=${NEXT_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            echo "${CHANGELOG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  construir-y-publicar:
    name: Construir y publicar imagen Docker
    needs: versionar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Clonar repositorio en el tag de la versión
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.versionar.outputs.tag }}

      - name: Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos y etiquetas SemVer de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.versionar.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.versionar.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.versionar.outputs.tag }}
            type=raw,value=${{ needs.versionar.outputs.tag }}
            type=sha

      - name: Construir y publicar imagen Docker en GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.versionar.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crear-release:
    name: Crear lanzamiento (Release) en GitHub
    needs:
      - versionar
      - construir-y-publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Normalizar nombre de imagen
        id: image
        run: |
          echo "lower=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versionar.outputs.tag }}
          name: Versión ${{ needs.versionar.outputs.tag }}
          generate_release_notes: true
          body: |
            ### Cambios en ${{ needs.versionar.outputs.tag }}

            ${{ needs.versionar.outputs.changelog }}

            ---

            ### Imagen Docker en GitHub Container Registry (GHCR)

            ```bash
            # Versión específica
            docker pull ${{ steps.image.outputs.lower }}:${{ needs.versionar.outputs.version }}
            docker pull ${{ steps.image.outputs.lower }}:${{ needs.versionar.outputs.tag }}

            # Última versión estable
            docker pull ${{ steps.image.outputs.lower }}:latest
            ```

            **Digest:** `${{ needs.construir-y-publicar.outputs.digest }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Desplegar en Coolify
        run: |
          curl --fail --request POST '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
