services:
  postgres:
    image: postgres:16-alpine
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        RUN apk update && apk upgrade --no-cache && \
            apk add --no-cache --upgrade --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main zlib libxslt krb5-libs su-exec && \
            rm -f /usr/local/bin/gosu && ln -s /sbin/su-exec /usr/local/bin/gosu
    container_name: router-caddy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-router_caddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-router_caddy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  router:
    image: ghcr.io/code-memx/router-caddy:latest
    build: .
    container_name: router-caddy
    restart: unless-stopped
    ports:
      - "${ROUTER_PORT:-3000}:3000"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-router_caddy}}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
